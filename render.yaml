services:
  - type: web
    name: cheffys-crystals
    env: static
    buildCommand: npm install && npm run fetch:shopify && npm run build && npm run prerender
    envVars:
      - key: NODE_VERSION
        value: 20
    routes:
      - type: rewrite
        source: /sitemap.xml
        destination: /sitemap.xml
      - type: rewrite
        source: /robots.txt
        destination: /robots.txt
      - type: rewrite
        source: /*
        destination: /index.html
